<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203a32"><title>فروشگاه محصولات | دکتر مصطفی خویی</title><link rel="stylesheet" href="assets/store.css"></head><body><div id="site-header"></div><main class="store-page"><div class="wrap"><div class="store-top"><div><div class="product-category">فروشگاه آنلاین</div><h1>محصولات</h1></div></div><div class="store-search"><input id="search" type="search" placeholder="نام محصول موردنظر را جست‌وجو کنید..." autocomplete="off" aria-label="جست‌وجوی محصولات"></div><div class="chips" id="filters"><button class="chip active" data-filter="all">همه محصولات</button><button class="chip" data-filter="tea">دمنوش</button><button class="chip" data-filter="herb">فرآورده گیاهی</button><button class="chip" data-filter="care">مراقبت و سلامت</button></div><div class="store-grid" id="products-grid"></div></div></main><script src="assets/store.js"></script><script>document.getElementById('site-header').innerHTML=storeHeader();initStoreHeader();</script><script>let activeFilter='all';const grid=document.getElementById('products-grid'),search=document.getElementById('search');function renderProducts(){const q=search.value.trim().toLocaleLowerCase('fa');const found=PRODUCTS.filter(p=>(activeFilter==='all'||(activeFilter.startsWith('cat:')?String(p.category_id)===activeFilter.slice(4):p.kind===activeFilter))&&(!q||(p.name+' '+p.category+' '+p.desc).toLocaleLowerCase('fa').includes(q)));grid.innerHTML=found.length?found.map(productCard).join(''):'<div class="store-empty">محصولی با این عبارت پیدا نشد. عبارت دیگری را جست‌وجو کنید.</div>'}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;renderProducts()}));search.addEventListener('input',renderProducts);renderProducts();document.addEventListener('store:catalog-ready',()=>{renderProducts();fetch('api/index.php?action=categories').then(r=>r.json()).then(d=>{if(!d.categories)return;document.getElementById('filters').innerHTML='<button class="chip active" data-filter="all">همه محصولات</button>'+d.categories.map(c=>'<button class="chip" data-filter="cat:'+c.id+'">'+c.name+'</button>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;renderProducts()}));});});</script></body></html>
