<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203a32"><title>جزئیات محصول | دکتر مصطفی خویی</title><link rel="stylesheet" href="assets/store.css"></head><body><div id="site-header"></div><main class="store-page"><div class="wrap"><div class="store-top"><a class="secondary-store-btn" href="products.html">← بازگشت به محصولات</a><a class="secondary-store-btn" href="cart.html">سبد خرید 🛒</a></div><div id="product-detail"></div></div></main><script src="assets/store.js"></script><script>document.getElementById('site-header').innerHTML=storeHeader();initStoreHeader();</script><script>
const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('product-detail');function escP(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function renderProduct(){const p=PRODUCTS.find(x=>x.id===id);if(!p){root.innerHTML='<div class="store-empty">این محصول پیدا نشد. <a href="products.html">بازگشت به فروشگاه</a></div>';return}root.innerHTML=`<div class="detail-layout"><div class="detail-art">${productVisual(p,'detail-product-image')}</div><div class="detail-panel"><small class="product-category">${escP(p.category||'')}</small><h1>${escP(p.name)}</h1><p>${escP(p.desc||'')}</p><div class="detail-price">${money(p.price)}</div><div class="detail-actions"><button class="primary-store-btn add-single" id="add" type="button">افزودن به سبد خرید</button></div><div class="notice" id="add-notice" role="status" aria-live="polite">برای افزودن این محصول، دکمه زیر را انتخاب کنید.</div></div></div>`;document.getElementById('add').onclick=()=>{const ok=addToCart(p.id,1),n=document.getElementById('add-notice');if(ok){n.classList.add('success-notice');n.innerHTML='✓ محصول شما با موفقیت به سبد خرید انتقال یافت. <a href="cart.html">مشاهده سبد خرید</a>';updateCartCount()}else n.textContent='افزودن محصول ممکن نشد.';};}renderProduct();document.addEventListener('store:catalog-ready',renderProduct);
</script></body></html>
